name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node (JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies (hardware-free)
        run: python -m pip install -r requirements-ci.txt

      - name: Compile, import, test, JS syntax, security, synthetic evaluation
        env:
          PYTHON: python
        run: bash scripts/ci_check.sh

      # Camera / model tests need real hardware and are reported as
      # SKIPPED: HARDWARE_REQUIRED by pytest above; they are never faked green.

  firestore-emulator:
    # Same repository contract as SQLite (tests/repo_contract.py) against the
    # LOCAL Firestore emulator; "demo-" project ids cannot reach production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-firestore-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-firestore-ci.txt
          npm ci --no-audit --no-fund
      - name: Firestore emulator contract tests
        env:
          PYTHON: python
        run: bash scripts/firestore_emulator_check.sh

